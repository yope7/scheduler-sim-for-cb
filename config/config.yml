param_env:
  n_window: 100 # リソースマップの横幅
  n_on_premise_node: 256 # オンプレミスノードの数
  n_cloud_node: 1024 # クラウドノードの数
  n_job_queue_obs: 5 # ジョブキューの観測部分の長さ
  n_job_queue_bck: 5 # ジョブキューの非観測部分の長さ
  penalty_not_allocate: 0 # ジョブを割り当てなかった時のペナルティ
  penalty_invalid_action: 0.1 # 無効な行動をした時のペナルティ
param_agent:
  weight_wt: 0 # 報酬における待ち時間の重み
  weight_cost: 1 # 報酬におけるコストの重み
param_simulation:
  nb_steps: 1 # ステップ数
  nb_episodes: 2000 # エピソード数（500から2000に増加）
  nb_max_episode_steps: -1 # 1エピソードあたりの最大ステップ数(-1:最大ステップ無し)
  multi_algorithm: true # true: multi algorithm(先にジョブを決める) false: single algorithm(後でジョブを決める)
  folder_suffix: "result" # 実験結果画像を保存するフォルダの名前の末尾につける文字列

# アルゴリズム横断実験で揃える変数（micro_benchmark / mo_benchmark_hv / main の既定引数）
# 実験規約: (1) 同一比較では env_backend とジョブ生成・param_* を揃える (2) 単一要因の原則
#   （1変数だけ変え、他は固定）— env_backend を変えると Python/C の差異の比較になる
# env_backend: c … SchedulingEnvCacheOptimized（NSGA-II/DQN/分散PCN と整合。既定）
# env_backend: python … 純Python SchedulingEnv（分散PCNは C のみのため mo_benchmark_hv では pcn を除外）
param_algorithm_compare:
  env_backend: c
  seed: 0
  nb_jobs: 24
  n_on_premise_node: 256
  n_cloud_node: 1024
  job_generation_episodes: 2000 # JobGenerator のエピソード本数（param_simulation.nb_episodes と揃える想定）
  nsga2:
    pop_size: 100
    num_generations: 300
    n_workers: -1
  dqn_single:
    train_episodes: 50000
  # DQN: Ray 分散で重みスイープ（pareto_distributed）→ distributed_pareto_results に JSON、HV はベンチで算出
  dqn_distributed_pareto:
    weight_steps: 10
    episodes_per_weight: 1000
    num_workers: 4
  distributed_pcn:
    # フェーズ1: 各Actorのランダム収集本数 / フェーズ3: 改良経験の学習イテレーション数（いずれも100が実験規約）
    n_iterations: 100
    n_actors: 32
    initial_episodes: 100
    quick: false
    profile: false
    # 左上先端 PF 本番（dual12 + 低域 EvalギャップFB）。CLI --left-tail と同じ
    left_tail: true
    # 実装既定: イベント観測 + ビットマップ復元OFF + フェーズ1 action sweep ON
    use_event_obs: true
  micro_benchmark_wall_clock:
    nsga_pop: 5
    nsga_gen: 2
    dqn_episodes: 30
  mo_hypervolume_benchmark:
    ref_margin: 0.05
    tts_fraction: 0.9
    hv_threshold: null
    out_dir: mo_hv_out
    algorithms: "nsga2,pcn_distributed"
    dqn_weight_steps: 5
    dqn_episodes_per_weight: 500
    nsga_n_workers: -1

param_job:
  max_t: 10 # 最大実時間
  job_is_constant: true # true: 全エピソードで同じジョブを使う false: 全てのエピソードで別々のジョブを使う
  job_type: 1 # 1: default 2: job_trace file 3: random
  job_trace_path: job_trace/FY2024/scacctreq_202412_dec1_1000_jobs.csv # job_type=2用
  job_trace_n_jobs: 32 # 0以下で全件
  n_job_per_time: 4 # -1: random(1,6)
  max_processing_time: 3 # -1: random
  max_n_required_nodes: 3 # -1: random
  max_user_id: 8 # -1: random
  nb_jobs_per_user: 1 # -1: random
  user_increment: 1 # 1:true, 0:false
