# weekB先頭20000ジョブ・過負荷版(ρ=1.48、4096窓レシピcap=22700をそのまま流用)。
# 2026-08-17: 「2万ジョブは重い」という旧見積もりを出したのと同じ容量設定。
# job_trace_weekB_head20000_cap48000_pcn.yml (正容量ρ=0.70) との速度対比専用。
param_env:
  n_window: 100
  n_on_premise_node: 22700
  n_cloud_node: 90800
  n_job_queue_obs: 5
  n_job_queue_bck: 5
  penalty_not_allocate: 0
  penalty_invalid_action: 0.1
  n_jobs: 20000
param_agent:
  weight_wt: 0
  weight_cost: 1
param_simulation:
  nb_steps: 1
  nb_episodes: 2000
  nb_max_episode_steps: -1
  multi_algorithm: true
  folder_suffix: "result"
param_algorithm_compare:
  env_backend: c
  seed: 0
  nb_jobs: 1024
  n_on_premise_node: 22700
  n_cloud_node: 90800
  job_generation_episodes: 2000
  distributed_pcn:
    n_iterations: 100
    n_actors: 16
    initial_episodes: 100
    quick: false
    profile: false
    left_tail: false
    workload_adaptive: true
    conditioning: true
    mid_core: true
    use_event_obs: true
param_job:
  max_t: 10
  job_is_constant: true
  job_type: 2
  job_trace_path: job_trace/FY2024/scacctreq_202412_weekB_full_jobs.csv
  job_trace_n_jobs: 20000
  job_trace_exclude_largest_outlier: true
  n_job_per_time: 4
  max_processing_time: 3
  max_n_required_nodes: 3
  max_user_id: 8
  nb_jobs_per_user: 1
  user_increment: 1
