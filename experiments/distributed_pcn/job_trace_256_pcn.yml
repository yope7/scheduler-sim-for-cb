# トレース256（Dec先頭256ジョブ・外れ値除外）— 件数正規化(スケール依存α)の trace 汎化検証用。
# job_trace_1024_pcn.yml の n_jobs を 256 にしたもの（env も agent も param_env.n_jobs=256、
# 実ジョブ数 job_trace_n_jobs=256 と一致＝クロバー無し）。ノード数は全スケール固定(256/1024)。
param_env:
  n_window: 100
  n_on_premise_node: 256
  n_cloud_node: 1024
  n_job_queue_obs: 5
  n_job_queue_bck: 5
  penalty_not_allocate: 0
  penalty_invalid_action: 0.1
  n_jobs: 256
param_agent:
  weight_wt: 0
  weight_cost: 1
param_simulation:
  nb_steps: 1
  nb_episodes: 2000
  nb_max_episode_steps: -1
  multi_algorithm: true
  folder_suffix: "result"
param_algorithm_compare:
  env_backend: c
  seed: 0
  nb_jobs: 256
  n_on_premise_node: 256
  n_cloud_node: 1024
  job_generation_episodes: 2000
  distributed_pcn:
    n_iterations: 100
    n_actors: 16
    initial_episodes: 100
    quick: false
    profile: false
    left_tail: false
    workload_adaptive: true
    conditioning: true
    mid_core: true
    use_event_obs: true
param_job:
  max_t: 10
  job_is_constant: true
  job_type: 2
  job_trace_path: job_trace/FY2024/scacctreq_202412_top1024_jobs.csv
  job_trace_n_jobs: 256
  job_trace_exclude_largest_outlier: true
  n_job_per_time: 4
  max_processing_time: 3
  max_n_required_nodes: 3
  max_user_id: 8
  nb_jobs_per_user: 1
  user_increment: 1
