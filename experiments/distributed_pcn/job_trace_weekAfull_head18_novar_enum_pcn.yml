# 全探索(2^18)用: weekAfull win4096 の先頭18ジョブ窓の対照C(分散ゼロ合成: 到着・nodes据え置き, 全ptを69648に均し総占有をAとほぼ一致 +0.0005%)。容量は正容量比を窓サイズで縮約
# (22700*18/4096≈100, 90800*18/4096≈400)。巨大ジョブを除外しない(exclude_largest_outlier=false)。
# job_trace_weekAfull_win4096_pcn.yml のコピー改変。学習用ではなく実行可能集合の全列挙・分析用。
param_env:
  n_window: 100
  n_on_premise_node: 100
  n_cloud_node: 400
  n_job_queue_obs: 5
  n_job_queue_bck: 5
  penalty_not_allocate: 0
  penalty_invalid_action: 0.1
  n_jobs: 18
param_agent:
  weight_wt: 0
  weight_cost: 1
param_simulation:
  nb_steps: 1
  nb_episodes: 2000
  nb_max_episode_steps: -1
  multi_algorithm: true
  folder_suffix: "result"
param_algorithm_compare:
  env_backend: c
  seed: 0
  nb_jobs: 18
  n_on_premise_node: 100
  n_cloud_node: 400
  job_generation_episodes: 2000
  distributed_pcn:
    n_iterations: 100
    n_actors: 16
    initial_episodes: 100
    quick: false
    profile: false
    left_tail: false
    workload_adaptive: true
    conditioning: true
    mid_core: true
    use_event_obs: true
param_job:
  max_t: 10
  job_is_constant: true
  job_type: 2
  job_trace_path: job_trace/FY2024/scacctreq_202412_weekAfull_head18_novar_jobs.csv
  job_trace_n_jobs: 18
  job_trace_exclude_largest_outlier: false
  n_job_per_time: 4
  max_processing_time: 3
  max_n_required_nodes: 3
  max_user_id: 8
  nb_jobs_per_user: 1
  user_increment: 1
